name: Update MOEX quotes

on:
  schedule:
    # 5 запусков по будням вокруг основной сессии MOEX (10:00–18:40 МСК).
    # Время — UTC (МСК = UTC+3). Шаг между открытием и закрытием — 130 мин.
    # Минуты не круглые: запуски «ровно в :00» GitHub откладывает сильнее всего.
    - cron: "3 7 * * 1-5"     # 10:03 МСК — сразу после открытия
    - cron: "11 9 * * 1-5"    # 12:11 МСК
    - cron: "21 11 * * 1-5"   # 14:21 МСК
    - cron: "31 13 * * 1-5"   # 16:31 МСК
    - cron: "53 15 * * 1-5"   # 18:53 МСК — сразу после закрытия (аукцион закрытия до 18:50)
  push:
    branches: [main]
    paths:
      - "scripts/update_quotes.py"
      - "data/fundamentals.json"
      - "certs/**"
  workflow_dispatch:
    inputs:
      full:
        description: "Перезагрузить всю историю (--full)"
        required: false
        default: "false"

concurrency:
  group: update-quotes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run update
        run: |
          FLAG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.full }}" = "true" ]; then FLAG="--full"; fi
          python scripts/update_quotes.py $FLAG

      - name: Commit & push
        run: |
          git config user.name  "moex-bot"
          git config user.email "moex-bot@users.noreply.github.com"
          git add data/prices.json data/status.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(quotes): $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push
          fi
